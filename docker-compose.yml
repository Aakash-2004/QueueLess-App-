version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: queueless_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - queueless_network

  backend:
    build: 
      context: ./server
      dockerfile: Dockerfile
    container_name: queueless_backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/queueless-app
      - JWT_SECRET=queueless_super_secret_jwt_key_2026
      - PORT=5000
    depends_on:
      - mongodb
    networks:
      - queueless_network

  frontend:
    build: 
      context: ./client
      dockerfile: Dockerfile
    container_name: queueless_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - queueless_network

volumes:
  mongodb_data:

networks:
  queueless_network:
    driver: bridge
